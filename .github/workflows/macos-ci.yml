name: macos-ci

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  hosted:
    # from-c 会优先选择 backup/uya-hosted-<host_os>-<host_arch>.c；
    # hosted 主线固定走 Apple Silicon，稳定验证 macOS arm64 seeds。
    runs-on: macos-15
    env:
      HOST_OS: macos
      HOST_ARCH: arm64
      TARGET_OS: macos
      TARGET_ARCH: arm64
      UYA_ROOT: ${{ github.workspace }}/lib/
      LC_ALL: C

    steps:
    - uses: actions/checkout@v4

    - name: Prepare hosted seed for macOS
      run: |
        rm -rf bin
        mkdir -p bin

    - name: Bootstrap seed compiler from native hosted seed
      run: make from-c-native

    - name: Build hosted compiler
      run: make uya-hosted

    - name: Verify hosted self-host
      run: make b-hosted

    - name: Run hosted test profile
      env:
        TEST_PROFILE: hosted
        SKIP_DARWIN_DEFAULT: "1"
      run: |
        set +e
        make tests-hosted 2>&1 | tee /tmp/tests-hosted.log
        status=${PIPESTATUS[0]}
        fails=$(grep '❌' /tmp/tests-hosted.log | perl -pe 's/\e\[[0-9;]*m//g' | sed 's/^ *//' | paste -sd ';' -)
        if [ -n "$fails" ]; then
          echo "::error::hosted tests failed: $fails"
          # 并行矩阵里的失败项只报退出码，缺少断言详情；这里逐个单独重跑，
          # 把输出写进注解（注解公开可读，无需 token 即可定位回归）。
          for name in $(grep '❌' /tmp/tests-hosted.log | perl -pe 's/\e\[[0-9;]*m//g' \
              | sed -E 's/^ *❌ ([^:]+):.*/\1/'); do
            if [ ! -f "tests/$name.uya" ]; then
              continue
            fi
            echo "----- detail begin: $name -----"
            # macOS 没有 timeout(1)，用 perl 的 alarm 给重跑封顶，避免挂死拖满 job 预算。
            UYA_ROOT="$PWD/lib/" RUNTIME_MODE=hosted \
              perl -e 'alarm 240; exec @ARGV' \
              ./bin/uya-hosted test "tests/$name.uya" 2>&1 | tee "/tmp/detail-$name.log"
            echo "----- detail end: $name -----"
            echo "::error title=$name::$(tail -60 "/tmp/detail-$name.log" | cut -c1-400 | tr '\n' '|')"
          done
        fi
        exit "$status"

    - name: Resolve microapp arm64 toolchain
      run: |
        echo "TARGET_GCC=$(xcrun --find clang)" >> "$GITHUB_ENV"
        echo "OBJCOPY=$(xcrun --find llvm-objcopy)" >> "$GITHUB_ENV"
        echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

    - name: Run microapp hosted smoke
      run: make microapp-hosted-smoke

    - name: Run microapp aarch64 hosted runtime
      run: make microapp-aarch64-runtime-check

    - name: Run microapp macOS arm64 hosted runtime
      run: make microapp-macos-runtime-check
