name: release-publish

# 「打 tag 的提交通过 CI 之后才发布版本」的落地方式。
#
# 链路：
#   1. push 标签（v*）→ ubuntu-ci（完整 make release）与 macos-ci（hosted 主线）
#      各自在**这个标签的提交**上跑一轮（见两个 workflow 的 `tags: [ "v*" ]` 触发）；
#   2. 任一轮结束 → 本 workflow 被 workflow_run 唤醒；
#   3. publish job 轮询同一标签上的全部 CI run：**全绿才发 GitHub Release**，
#      任何一条失败/取消就拒绝，等满 2 小时仍未出结论也拒绝（宁可不出，也不发未验证的版本）。
#
# 发行说明来源：docs/releases/RELEASE_<tag>.md（与 tests/verify_version_sources.sh 的
# 版本一致性口径一致）；标签带 `-rc`/`-beta` 之类后缀时自动标记为预发布。
#
# 失败后重发：修好 CI 后在 Actions 里 Re-run jobs 会再次触发本 workflow；
# 也可以手动 workflow_dispatch 指定标签补发（先把 dry_run 留空/置 false）。

on:
  workflow_run:
    workflows: ["ubuntu-ci", "macos-ci"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本标签（例如 v0.12.0）：必须已在 main 上、且该标签的 CI 全绿"
        required: true
        type: string
      dry_run:
        description: "只演练：照常校验与等待 CI，但不真正创建/更新 Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # 创建/更新 Release
  actions: read     # gh run list 查 CI 状态

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    # 2 小时等 CI + 余量；真卡死时得到一条明确的超时错误，而不是默认的 6 小时。
    timeout-minutes: 150
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      # 必须在这个标签上跑过的 CI 工作流（全部要通过）
      EXPECTED_WORKFLOWS: "ubuntu-ci macos-ci"
    steps:
      - name: Validate tag name
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::${TAG} 不是版本标签（期望 vMAJOR.MINOR.PATCH[±后缀]），本次不发布"
            exit 1
          fi
          echo "标签：${TAG}（dry_run=${DRY_RUN}）"

      - name: Wait for every CI run on this tag
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 7200 ))
          while :; do
            all_ok=1
            for wf in ${EXPECTED_WORKFLOWS}; do
              # 只看该标签触发的 push run：main 上同名 workflow 的成功不能替代标签上的验证。
              state=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${wf}" \
                        --branch "${TAG}" --limit 20 \
                        --json event,status,conclusion,headBranch \
                      | jq -r --arg tag "${TAG}" '
                          map(select(.event == "push" and .headBranch == $tag)) as $runs
                          | if ($runs | length) == 0 then "missing"
                            elif ([$runs[] | select(.status != "completed")] | length) > 0 then "pending"
                            elif ([$runs[] | select(.conclusion != "success")] | length) > 0 then "failed"
                            else "ok" end')
              case "${state}" in
                ok)
                  echo "✓ ${wf}：${TAG} 上通过"
                  ;;
                failed)
                  echo "::error::${wf} 在 ${TAG} 上没有通过，拒绝发布（修好后 Re-run jobs 或手动补发）"
                  gh run list --workflow "${wf}" --branch "${TAG}" --limit 5 || true
                  exit 1
                  ;;
                missing)
                  echo "::error::${wf} 没有在标签 ${TAG} 上跑过：检查 .github/workflows/${wf}.yml 的 tags 触发"
                  exit 1
                  ;;
                *)
                  echo "… ${wf}：仍在进行，30 秒后再看"
                  all_ok=0
                  ;;
              esac
            done
            if [ "${all_ok}" -eq 1 ]; then
              echo "✓ 标签 ${TAG} 上的 CI 全部通过"
              break
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::等待 ${TAG} 的 CI 超过 2 小时仍未全部通过，放弃发布"
              exit 1
            fi
            sleep 30
          done

      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Refuse tags that are not on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "✓ ${TAG} 指向的提交已在 main 上"
          else
            echo "::error::${TAG} 指向的提交不在 main 上，拒绝发布（发布必须来自已合入主干的提交）"
            exit 1
          fi

      - name: Publish GitHub release
        run: |
          set -euo pipefail
          notes="docs/releases/RELEASE_${TAG}.md"
          if [ ! -f "${notes}" ]; then
            echo "::error::缺少发行说明 ${notes}：版本发布必须带发行说明（参见 docs/release_process.md）"
            exit 1
          fi
          extras=()
          case "${TAG}" in
            *-*) extras+=(--prerelease) ;;
          esac
          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry_run：跳过实际发布；本应执行 gh release create ${TAG} --title ${TAG} --notes-file ${notes} ${extras[*]:-}"
            exit 0
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在：更新标题与说明"
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" --notes-file "${notes}" "${extras[@]}"
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" --notes-file "${notes}" --verify-tag "${extras[@]}"
          fi
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json url,tagName,isPrerelease \
            --jq '"✓ 已发布：\(.url)（tag=\(.tagName), prerelease=\(.isPrerelease)）"'
